<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretimin Geleceği Topluluğu</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --bg-color: #000000;           /* Saf Siyah */
            --card-bg: #0a0a0a;            /* Çok Koyu Antrasit */
            --card-hover: #121212;         /* Hoverda Hafif Açılan Ton */
            --border-color: #1a1a1a;       /* Neredeyse Görünmez Kenarlık */
            --border-hover: #333333;       /* Hoverda Belirginleşen Kenarlık */
            --text-main: #ffffff;          /* Saf Beyaz */
            --text-muted: #737373;         /* Sofistike Gri */
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* Ana Konteyner */
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ÜST BÖLÜM: Logo ve Başlık --- */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Işıksız, kutusuz, tertemiz logo alanı */
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid var(--border-color); /* Sadece sınırları belli eden mikroskobik bir çizgi */
            background-color: var(--bg-color);
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .slogan {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.01em;
        }

        /* --- BAĞLANTI KARTLARI --- */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px 20px;
            border-radius: var(--radius);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        /* Kart İçeriği Sol Taraf (İkon ve Metin) */
        .card-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-wrapper {
            width: 24px;
            display: flex;
            justify-content: center;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.25s ease;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .link-title {
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .link-desc {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 400;
        }

        /* Sağ Ok İkonu */
        .arrow-icon {
            color: #333333;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        /* --- HOVER EFEKTİ (Sadece Renk Değişimi, Abartı Yok) --- */
        .link-card:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
        }

        .link-card:hover .icon-wrapper {
            color: var(--text-main);
        }

        .link-card:hover .arrow-icon {
            color: var(--text-main);
            transform: translateX(4px);
        }

        /* --- ALT BİLGİ --- */
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.7rem;
            color: #404040;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="header">
            <img src="logo.png" alt="Topluluk Logosu" class="logo">
            <h1 class="title">Üretimin Geleceği Topluluğu</h1>
            <p class="slogan">"Üretimin Geleceği Bizim Elimizde"</p>
        </header>

        <main class="links-wrapper">
            
            <a href="https://uretimingelecegi.vercel.app/" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-wrapper"><i class="fa-solid fa-globe"></i></div>
                    <div class="text-group">
                        <span class="link-title">Resmi Web Sitesi</span>
                        <span class="link-desc">Vizyonumuz ve projelerimiz</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://instagram.com/subuuretimingelecegi" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-wrapper"><i class="fa-brands fa-instagram"></i></div>
                    <div class="text-group">
                        <span class="link-title">Instagram</span>
                        <span class="link-desc">@subuuretimingelecegi</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://forms.gle/zJyiKcnU132S8Qqy9" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-wrapper"><i class="fa-solid fa-user-plus"></i></div>
                    <div class="text-group">
                        <span class="link-title">Bize Katıl</span>
                        <span class="link-desc">Üye kayıt formu</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=uretimingelecegi@gmail.com" target="_blank" class="link-card">
                <div class="card-content">
                    <div class="icon-wrapper"><i class="fa-regular fa-envelope"></i></div>
                    <div class="text-group">
                        <span class="link-title">Bize Ulaşın</span>
                        <span class="link-desc">uretimingelecegi@gmail.com</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

        </main>
    </div>

</body>
</html>
